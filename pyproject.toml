[project]
name = "tg-arcade"
version = "0.1.0"
description = "Telegram-бот с каталогом HTML5 мини-игр и рекордами для групп"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
